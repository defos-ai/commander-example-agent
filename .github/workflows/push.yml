name: Push agent image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        type: string
        required: true
        default: stable

permissions:
  contents: read
  packages: write

concurrency:
  group: push-agent-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read image name from AgentType
        id: image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          declarations = re.findall(
              r'(?m)^[ \t]*const[ \t]+AgentType(?:[ \t]+[\w.]+)?[ \t]*=[ \t]*"([^"\r\n]*)"[ \t]*(?://[^\r\n]*)?$',
              Path("agent.go").read_text(),
          )
          if len(declarations) != 1:
              raise SystemExit("agent.go must declare AgentType once as a string literal")
          agent_type = declarations[0]
          if not re.fullmatch(r"[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*", agent_type):
              raise SystemExit("AgentType must be a valid lowercase Docker image name")
          tag = os.environ["IMAGE_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag):
              raise SystemExit("Invalid Docker image tag")
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          image = f"ghcr.io/{owner}/commander-{agent_type}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name={image}\ntag={tag}\n")
          print(f"Publishing {image}:{tag}")
          PY
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go mod download
          go test -race -count=1 -timeout=3m ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
